<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
<defs><marker id="ah-gray" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1.5 L11,6 L1,10.5 z" fill="#5F6368"/></marker><marker id="ah-light" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1.5 L11,6 L1,10.5 z" fill="#9AA0A6"/></marker><marker id="ah-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1.5 L11,6 L1,10.5 z" fill="#1A73E8"/></marker><marker id="ah-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1.5 L11,6 L1,10.5 z" fill="#188038"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3C4043" flood-opacity="0.10"/></filter></defs>
<rect width="1600" height="640" fill="#FFFFFF"/>
<text x="48" y="62" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="500" fill="#202124" text-anchor="start" xml:space="preserve">How the model router handles a request</text>
<text x="48" y="96" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F6368" text-anchor="start" xml:space="preserve">Example: a client asks for Claude Opus 4.7 on the gemini-claude-router path.</text>
<rect x="48.0" y="140" width="272.0" height="330" rx="16" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="90.0" cy="184" r="20" fill="#1A73E8"/>
<text x="90.0" y="190.48" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">1</text>
<text x="122.0" y="192" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#202124" text-anchor="start" xml:space="preserve">Intercept</text>
<text x="72.0" y="244" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#5F6368" text-anchor="start" xml:space="preserve">API Gateway receives the</text>
<text x="72.0" y="268" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#5F6368" text-anchor="start" xml:space="preserve">POST request on a path</text>
<text x="72.0" y="292" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#5F6368" text-anchor="start" xml:space="preserve">that uses a model router.</text>
<rect x="66.0" y="376" width="236.0" height="70" rx="10" fill="#202124"/>
<text x="80.0" y="404" font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#E8EAED" text-anchor="start" xml:space="preserve">POST /v1/chat/gemini-claude</text>
<text x="80.0" y="428" font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#FDD663" text-anchor="start" xml:space="preserve">→ gemini-claude-router</text>
<line x1="324.0" y1="305.0" x2="352.0" y2="305.0" stroke="#1A73E8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah-blue)"/>
<rect x="356.0" y="140" width="272.0" height="330" rx="16" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="398.0" cy="184" r="20" fill="#1A73E8"/>
<text x="398.0" y="190.48" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">2</text>
<text x="430.0" y="192" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#202124" text-anchor="start" xml:space="preserve">Inspect</text>
<text x="380.0" y="244" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#5F6368" text-anchor="start" xml:space="preserve">The router reads the model</text>
<text x="380.0" y="268" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#5F6368" text-anchor="start" xml:space="preserve">attribute in the JSON</text>
<text x="380.0" y="292" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#5F6368" text-anchor="start" xml:space="preserve">payload.</text>
<rect x="374.0" y="376" width="236.0" height="70" rx="10" fill="#202124"/>
<text x="388.0" y="404" font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#E8EAED" text-anchor="start" xml:space="preserve">"model": "claude-opus-4-7"</text>
<text x="388.0" y="428" font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#FDD663" text-anchor="start" xml:space="preserve">"messages": [ … ]</text>
<line x1="632.0" y1="305.0" x2="660.0" y2="305.0" stroke="#1A73E8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah-blue)"/>
<rect x="664.0" y="140" width="272.0" height="330" rx="16" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="706.0" cy="184" r="20" fill="#1A73E8"/>
<text x="706.0" y="190.48" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">3</text>
<text x="738.0" y="192" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#202124" text-anchor="start" xml:space="preserve">Match</text>
<text x="688.0" y="244" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#5F6368" text-anchor="start" xml:space="preserve">The model string is matched</text>
<text x="688.0" y="268" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#5F6368" text-anchor="start" xml:space="preserve">against the router's rules.</text>
<text x="688.0" y="292" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#5F6368" text-anchor="start" xml:space="preserve">No match → defaultModel.</text>
<rect x="682.0" y="376" width="236.0" height="70" rx="10" fill="#202124"/>
<text x="696.0" y="404" font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#E8EAED" text-anchor="start" xml:space="preserve">rule: claude-opus-4-7</text>
<text x="696.0" y="428" font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#FDD663" text-anchor="start" xml:space="preserve">→ anthropic-claude-opus-47</text>
<line x1="940.0" y1="305.0" x2="968.0" y2="305.0" stroke="#1A73E8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah-blue)"/>
<rect x="972.0" y="140" width="272.0" height="330" rx="16" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="1014.0" cy="184" r="20" fill="#1A73E8"/>
<text x="1014.0" y="190.48" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">4</text>
<text x="1046.0" y="192" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#202124" text-anchor="start" xml:space="preserve">Transcode</text>
<text x="996.0" y="244" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#5F6368" text-anchor="start" xml:space="preserve">The OpenAI-format request</text>
<text x="996.0" y="268" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#5F6368" text-anchor="start" xml:space="preserve">is translated to the target</text>
<text x="996.0" y="292" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#5F6368" text-anchor="start" xml:space="preserve">model's native API.</text>
<rect x="990.0" y="376" width="236.0" height="70" rx="10" fill="#202124"/>
<text x="1004.0" y="404" font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#E8EAED" text-anchor="start" xml:space="preserve">OpenAI chat format</text>
<text x="1004.0" y="428" font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#FDD663" text-anchor="start" xml:space="preserve">→ Anthropic :rawPredict</text>
<line x1="1248.0" y1="305.0" x2="1276.0" y2="305.0" stroke="#1A73E8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah-blue)"/>
<rect x="1280.0" y="140" width="272.0" height="330" rx="16" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="1322.0" cy="184" r="20" fill="#1A73E8"/>
<text x="1322.0" y="190.48" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">5</text>
<text x="1354.0" y="192" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#202124" text-anchor="start" xml:space="preserve">Respond</text>
<text x="1304.0" y="244" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#5F6368" text-anchor="start" xml:space="preserve">The gateway calls Model</text>
<text x="1304.0" y="268" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#5F6368" text-anchor="start" xml:space="preserve">Garden and returns an</text>
<text x="1304.0" y="292" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#5F6368" text-anchor="start" xml:space="preserve">OpenAI-compatible response.</text>
<rect x="1298.0" y="376" width="236.0" height="70" rx="10" fill="#202124"/>
<text x="1312.0" y="404" font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#E8EAED" text-anchor="start" xml:space="preserve">← chat.completion</text>
<text x="1312.0" y="428" font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#FDD663" text-anchor="start" xml:space="preserve">  (JSON or SSE stream)</text>
<rect x="48" y="500" width="1504" height="100" rx="14" fill="#E8F0FE"/>
<circle cx="84" cy="538" r="14" fill="#1A73E8"/>
<text x="84" y="543" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">i</text>
<text x="110" y="544" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="start" xml:space="preserve"><tspan fill="#174EA6" font-weight="700" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif">No rule matched? </tspan><tspan fill="#202124" font-weight="400" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif">The router sends the request to defaultModel — in this example, </tspan><tspan fill="#202124" font-weight="400" font-family="'Roboto Mono', Menlo, Consolas, monospace">google/gemini-3.8-flash</tspan><tspan fill="#202124" font-weight="400" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif">.</tspan></text>
<text x="110" y="576" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="15" text-anchor="start" xml:space="preserve"><tspan fill="#5F6368" font-weight="400" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif">On OpenAI-compatible routes the model string is forwarded as-is, so it must be a full publisher model ID such as </tspan><tspan fill="#5F6368" font-weight="400" font-family="'Roboto Mono', Menlo, Consolas, monospace">openai/gpt-oss-120b-maas</tspan><tspan fill="#5F6368" font-weight="400" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif">.</tspan></text>
</svg>
