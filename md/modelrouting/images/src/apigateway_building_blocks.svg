<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650">
<defs><marker id="ah-gray" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1.5 L11,6 L1,10.5 z" fill="#5F6368"/></marker><marker id="ah-light" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1.5 L11,6 L1,10.5 z" fill="#9AA0A6"/></marker><marker id="ah-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1.5 L11,6 L1,10.5 z" fill="#1A73E8"/></marker><marker id="ah-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1.5 L11,6 L1,10.5 z" fill="#188038"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3C4043" flood-opacity="0.10"/></filter></defs>
<rect width="1600" height="650" fill="#FFFFFF"/>
<text x="48" y="62" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="500" fill="#202124" text-anchor="start">API Gateway building blocks</text>
<text x="48" y="96" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F6368" text-anchor="start">An API holds versioned API configs. A gateway serves one API config at a public URL.</text>
<path d="M48,262 Q48,250 60,250 L188,250 L218,280 L218,448 Q218,460 206,460 L60,460 Q48,460 48,448 Z" stroke="#BDC1C6" stroke-width="1.5" fill="#FFFFFF" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M188,250 L188,280 L218,280" stroke="#BDC1C6" stroke-width="1.5" fill="#F1F3F4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="133.0" y="342" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="500" fill="#202124" text-anchor="middle">apispec.yaml</text>
<text x="133.0" y="368" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6368" text-anchor="middle">OpenAPI 3.x</text>
<rect x="78" y="390" width="110" height="6" rx="3" fill="#F1F3F4"/>
<rect x="78" y="404" width="84" height="6" rx="3" fill="#F1F3F4"/>
