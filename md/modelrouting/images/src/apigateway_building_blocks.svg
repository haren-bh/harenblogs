<text x="133.0" y="496" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6368" text-anchor="middle">Upload with the console,</text>
<text x="133.0" y="516" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6368" text-anchor="middle">gcloud, or Antigravity CLI</text>
<line x1="222" y1="355" x2="344" y2="355" stroke="#5F6368" stroke-width="2" stroke-linecap="round" marker-end="url(#ah-gray)"/>
<text x="281" y="343" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6368" text-anchor="middle">creates</text>
<rect x="350" y="150" width="520" height="420" rx="18" fill="#F8F9FA" stroke="#BDC1C6" stroke-width="1.5"/>
<text x="378" y="192" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#202124" text-anchor="start">API</text>
<rect x="428" y="170" width="150" height="30" rx="8" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.5"/>
<text x="503.0" y="190.04" font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#202124" text-anchor="middle">modelrouting</text>
<text x="378" y="228" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5F6368" text-anchor="start">Managed service: modelrouting-&lt;hash&gt;.apigateway.&lt;project&gt;.cloud.goog</text>
<rect x="402" y="254" width="444" height="276" rx="14" fill="#FFFFFF" fill-opacity="1" stroke="#DADCE0" stroke-width="1.5"/>
<text x="834" y="274" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#80868B" text-anchor="end">API config v2 …</text>
<rect x="378" y="284" width="444" height="266" rx="14" fill="#FFFFFF" stroke="#1A73E8" stroke-width="1.5" filter="url(#shadow)"/>
<text x="402" y="324" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="500" fill="#202124" text-anchor="start">API config</text>
<rect x="510" y="302" width="196" height="30" rx="8" fill="#E8F0FE"/>
<text x="608.0" y="321.86" font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="500" fill="#174EA6" text-anchor="middle">modelrouting-cfg-v1</text>
<text x="402" y="370" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#202124" text-anchor="start">•  Your OpenAPI 3.x spec (apispec.yaml)</text>
<text x="402" y="406" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#202124" text-anchor="start">•  Backend auth service account</text>
<text x="402" y="442" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#202124" text-anchor="start">•  Validated when you create it</text>
<text x="402" y="478" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#202124" text-anchor="start">•  Immutable: create a new config to change it</text>
<line x1="874" y1="380" x2="976" y2="380" stroke="#1A73E8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah-blue)"/>
<text x="925.0" y="366" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#1A73E8" text-anchor="middle">deployed to</text>
<rect x="980" y="200" width="320" height="360" rx="16" fill="#FFFFFF" stroke="#1A73E8" stroke-width="2" filter="url(#shadow)"/>
<text x="1008" y="242" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#202124" text-anchor="start">Gateway</text>
<rect x="1008" y="260" width="228" height="30" rx="8" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.5"/>
<text x="1122.0" y="280.04" font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#202124" text-anchor="middle">modelrouting-gateway</text>
<text x="1008" y="320" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#5F6368" text-anchor="start">Region: us-central1</text>
<text x="1008" y="356" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#202124" text-anchor="start">•  Regional, fully managed runtime</text>
<text x="1008" y="384" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#202124" text-anchor="start">•  Serves one API config at a time</text>
<text x="1008" y="412" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#202124" text-anchor="start">•  Always streaming with model routing</text>
<text x="1008" y="462" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#5F6368" text-anchor="start">Default URL</text>
<text x="1008" y="488" font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#202124" text-anchor="start">https://&lt;gateway-id&gt;-</text>
<text x="1008" y="509" font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#202124" text-anchor="start">&lt;project-number&gt;.&lt;region&gt;</text>
<text x="1008" y="530" font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#202124" text-anchor="start">.gateway.dev</text>
<rect x="1380" y="230" width="180" height="96" rx="12" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.5"/>
<text x="1470" y="270" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" fill="#202124" text-anchor="middle">Clients</text>
<text x="1470" y="296" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6368" text-anchor="middle">OpenAI-compatible</text>
<text x="1470" y="314" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6368" text-anchor="middle">requests</text>
<line x1="1376" y1="278" x2="1304" y2="278" stroke="#5F6368" stroke-width="2" stroke-linecap="round" marker-end="url(#ah-gray)"/>
<rect x="1380" y="430" width="180" height="96" rx="12" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.5"/>
<text x="1470" y="470" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" fill="#202124" text-anchor="middle">Model Garden</text>
<text x="1470" y="496" font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#5F6368" text-anchor="middle">aiplatform.</text>
<text x="1470" y="514" font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#5F6368" text-anchor="middle">googleapis.com</text>
<line x1="1304" y1="478" x2="1376" y2="478" stroke="#5F6368" stroke-width="2" stroke-linecap="round" marker-end="url(#ah-gray)"/>
<text x="48" y="618" font-family="'Google Sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#5F6368" text-anchor="start">To change routing rules, create a new API config and update the gateway to use it. Model routing gateways always run in streaming mode.</text>
</svg>
